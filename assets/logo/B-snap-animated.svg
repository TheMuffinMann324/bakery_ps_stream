<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Flat B with diagonal stripes and split and snap animation">
<defs><path id="b" fill-rule="evenodd" d="M155 118 L274 118 C327 118 353 146 353 188 C353 214 340 234 321 243 C352 253 370 277 370 312 C370 359 336 390 279 390 L155 390Z M216 171 L268 171 C288 171 299 181 299 197 C299 214 288 224 268 224 L216 224Z M216 278 L277 278 C300 278 313 288 313 307 C313 327 300 338 277 338 L216 338Z"/><clipPath id="top"><path d="M0 0H512V212.56L0 274Z"/></clipPath><clipPath id="bottom"><path d="M0 284L512 222.56V512H0Z"/></clipPath><mask id="stripes" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="white"/><path d="M80 233.8L420 131.8 M80 246.8L420 144.8 M80 377.8L420 275.8 M80 390.8L420 288.8" fill="none" stroke="black" stroke-width="3"/></mask></defs>
<style>
.a{animation:snapTop 3s infinite}.b{animation:snapBottom 3s infinite}
@keyframes snapTop{
0%,15%{transform:translate(0,0);animation-timing-function:cubic-bezier(.16,1,.3,1)}
35%,45%{transform:translate(-22px,-16px);animation-timing-function:cubic-bezier(.7,0,1,.3)}
52%{transform:translate(2.64px,1.92px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
59%{transform:translate(-.77px,-.56px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
67%,100%{transform:translate(0,0)}}
@keyframes snapBottom{
0%,15%{transform:translate(0,0);animation-timing-function:cubic-bezier(.16,1,.3,1)}
35%,45%{transform:translate(22px,16px);animation-timing-function:cubic-bezier(.7,0,1,.3)}
52%{transform:translate(-2.64px,-1.92px);animation-timing-function:cubic-bezier(.16,1,.3,1)}
